<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120803">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RUTINA">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>RUTINA v16</title>
  <style>
    :root{
      --bg:#120803;--panel:#190c07;--panel2:#211008;--panel3:#2a150c;
      --line:#6f3216;--line2:#3f2114;--accent:#ff5c20;--accent2:#ff7b43;
      --text:#fffaf7;--muted:#aa9a92;--gray:#514640;--green:#2b8b58;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:radial-gradient(650px 340px at 50% -10px,#6a230b 0%,#2b1207 42%,var(--bg) 77%);color:var(--text)}
    body{font-size:16px;-webkit-tap-highlight-color:transparent}
    button,input,textarea,select{font:inherit}
    button{color:inherit}
    button:active{transform:scale(.985)}
    .app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:92px}
    .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:18px 18px 12px;background:linear-gradient(#120803f5,#120803d4,transparent);backdrop-filter:blur(12px)}
    .eyebrow{font-size:11px;letter-spacing:1.8px;font-weight:900;color:var(--muted)}
    h1{margin:1px 0 0;font-size:29px;letter-spacing:-.6px}
    h2,h3,p{margin:0}
    main{padding:8px 18px 110px}
    .row{display:flex;align-items:center;gap:9px}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .hero{padding:20px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,#4c1e0da8,#201007f4);margin-bottom:16px;box-shadow:0 18px 45px #0005}
    .hero-title{font-size:28px;font-weight:900}.hero-sub{margin-top:8px;color:#e3d4cc}
    .progress{height:8px;background:#32180f;border-radius:99px;overflow:hidden;margin:15px 0 8px}.progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0 20px}
    .stat{padding:13px 6px;text-align:center;border:1px solid var(--line2);border-radius:16px;background:#1a0d08dd}.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:var(--muted)}
    .section-title{font-size:23px;font-weight:900;margin:22px 0 12px}
    .card{border:1px solid var(--line2);background:linear-gradient(#1b0e08,#160906);border-radius:18px;padding:15px;margin-bottom:10px}
    .click-card{cursor:pointer}.day-card{display:flex;align-items:center;gap:12px}.day-badge{width:45px;height:45px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-weight:900;flex:none}
    .card-main{flex:1;min-width:0}.card-title{font-size:18px;font-weight:900}.card-meta{font-size:13px;color:var(--muted);margin-top:4px}
    .check{width:32px;height:32px;border-radius:50%;border:1px solid #5d321f;display:grid;place-items:center;flex:none}
    .check.done{background:var(--accent);border-color:var(--accent)}.check.skip{background:#3a312c;border-color:#6b625d;color:#fff}
    .btn{border:0;border-radius:13px;padding:12px 15px;font-weight:900;cursor:pointer}.btn.primary{background:var(--accent)}.btn.secondary{background:var(--panel3);border:1px solid var(--line)}.btn.ghost{background:transparent;border:1px solid var(--line2)}.btn.danger{background:#32130e;border:1px solid #6e2c20}.btn.wide{width:100%}
    .round{width:46px;height:46px;border-radius:50%;border:1px solid #67351f;background:#1a0d08cc;display:grid;place-items:center;cursor:pointer}.icon{font-size:19px}
.exercise-edit-btn{width:38px;height:38px;border-radius:50%;border:1px solid #6b351d;background:#1a0d08;display:grid;place-items:center;cursor:pointer;font-weight:900}
.exercise-delete-btn{width:38px;height:38px;border-radius:50%;border:1px solid #6d2b20;background:#32130e;color:#ff9a83;display:grid;place-items:center;cursor:pointer;font-weight:900}

    .pill{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;border:1px solid #65351f;background:#281108;color:#f5ddd1;font-size:11px;font-weight:900}
    .badge{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900}.badge.orange{background:var(--accent)}.badge.gray{background:#3b322d;color:#f1e9e4}
    .form{display:grid;gap:11px}.label{display:block;font-size:12px;letter-spacing:.6px;color:#cdbdb5;font-weight:900;margin-bottom:6px}
    .input,.select,.textarea{width:100%;border:1px solid #5a2b18;background:#150a06;color:#fff;border-radius:12px;padding:12px 13px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--accent)}
    .textarea{min-height:88px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .modal-bg{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);z-index:90;display:grid;align-items:end}
    .modal{width:min(100%,720px);max-height:92vh;overflow:auto;background:#160b07;border:1px solid #5e2b18;border-radius:22px 22px 0 0;padding:18px;box-shadow:0 -20px 60px #000b}
    .modal-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal h3{font-size:24px}
    .close{border:0;background:none;font-size:28px;color:#aaa;padding:4px 7px;cursor:pointer}.modal-actions{display:flex;gap:8px;margin-top:15px}.modal-actions>*{flex:1}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,720px);z-index:30;display:flex;justify-content:space-around;padding:9px 10px 12px;border-top:1px solid #3a2117;background:rgba(18,8,3,.95);backdrop-filter:blur(16px)}
    .nav-btn{border:1px solid transparent!important;background:transparent!important;color:#b7a59d!important;padding:8px 13px;border-radius:12px;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:78px;cursor:pointer}
    .nav-btn span{font-size:20px;line-height:1}.nav-btn small{font-size:11px;font-weight:900}.nav-btn.active{background:#2a140b!important;border-color:#71361c!important;color:#fff!important}
    .plan-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #2b1710}.plan-row:last-child{border-bottom:0}
    .plan-number{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--accent);font-weight:900;font-size:12px;flex:none}
    .plan-main{flex:1}.exercise-name{font-size:19px;font-weight:900}.exercise-meta{font-size:12px;color:var(--muted);margin-top:4px}
    .timer-bar{position:sticky;bottom:72px;z-index:25;display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:center;padding:9px 0;background:linear-gradient(transparent,#120803 30%)}
    .timer-box{padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:#2a140b;text-align:center;min-width:84px}.timer-box .time{font-size:17px;font-weight:900}.timer-box .label{margin:0;font-size:9px}
    .workout-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}.workout-header .grow{flex:1}.workout-title{font-size:27px;font-weight:900;letter-spacing:-.5px}
    .exercise-index{font-size:12px;color:var(--muted);margin-top:4px}
    .unit-toggle{display:flex;padding:3px;border:1px solid var(--line2);background:#150a06;border-radius:11px;margin:10px 0}.unit-toggle button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:900;padding:8px;border-radius:8px;cursor:pointer}.unit-toggle button.active{background:var(--accent);color:#fff}
    .subhead{font-size:11px;letter-spacing:1px;font-weight:900;color:#c7b6ae;margin-top:14px}
    .set-head,.set-row{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:8px;align-items:center}
    .set-head{margin-top:8px;color:var(--muted);font-size:10px;text-transform:uppercase}.set-row{padding:9px 0;border-top:1px solid #2b1710}
    .set-num{text-align:center;color:#b8a69f;font-weight:900}.set-input{width:100%;min-width:0;background:#251109;border:1px solid #4b2919;color:#fff;border-radius:11px;padding:10px}
    .set-done{width:35px;height:35px;border-radius:50%;border:2px solid #5b453d;background:transparent;color:transparent;display:grid;place-items:center;font-weight:900;cursor:pointer}.set-done.done{background:var(--accent);border-color:var(--accent);color:#fff}.set-row.done{opacity:.6}.set-row.done .set-input{text-decoration:line-through}
    .rest-line{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;color:#b5a69f;font-size:12px;margin:-3px 0 3px}.rest-line:before,.rest-line:after{content:"";height:1px;background:#4b423e}.rest-active{color:var(--accent2);font-weight:900}
    .rest-panel{display:none;margin:8px 0 12px;border:1px solid var(--line);background:#201007;border-radius:15px;padding:12px 14px;align-items:center;justify-content:space-between}.rest-panel.show{display:flex}.rest-panel .rest-time{font-size:28px;font-weight:900}.rest-panel .rest-small{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:1px}
    .bottom-sheet{margin-top:13px;padding:15px;border-top:1px solid #362019;background:linear-gradient(#1f1009,#140805);border-radius:18px}.circle-mini{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#1f1009;display:grid;place-items:center;cursor:pointer}
    .stack{display:grid;gap:8px}.muted{color:var(--muted)}.small{font-size:12px}.empty{padding:28px 17px;border:1px dashed #543021;border-radius:16px;text-align:center;color:var(--muted)}
    .week-card{padding:13px 14px;border:1px solid var(--line2);border-radius:15px;background:#190c07;margin-bottom:9px}.week-card b{display:block}.week-card span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
    .exercise-detail-hero{padding:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#3b160ab0,#1b0d08);margin-bottom:12px}.exercise-detail-title{font-size:27px;font-weight:900;letter-spacing:-.5px}.exercise-detail-sub{margin-top:6px;font-size:12px;color:var(--muted)}.detail-set{display:grid;grid-template-columns:34px 1fr 1fr 54px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #2b1710}.detail-set.head{font-size:10px;color:#8e817b;text-transform:uppercase;letter-spacing:.7px}.detail-check{font-weight:900;color:#ff7a42}.detail-reference{padding:13px;border:1px solid #4e2919;border-radius:14px;background:#1b0d08;margin-top:12px}.detail-note{padding:12px;border-left:2px solid var(--accent);background:#190c07;margin-top:10px;color:#d8cbc4;font-size:12px}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}.cal-head{font-size:10px;color:var(--muted);text-align:center;padding:5px 0}.cal-day{aspect-ratio:1;display:grid;place-items:center;border:1px solid transparent;border-radius:10px;font-size:12px;color:#b4a39c}.cal-day.trained{background:#2a1209;border-color:#6b351d;color:#fff}.cal-day.today{border-color:var(--accent);color:#fff}
    .complete-screen{text-align:center;padding:18px 10px}.complete-title{font-size:28px;font-weight:900}.ring{width:190px;height:190px;margin:28px auto 20px;border-radius:50%;background:conic-gradient(var(--accent) var(--deg),#3b2c25 0);display:grid;place-items:center;position:relative}.ring:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#160b07}.ring-inner{position:relative;z-index:1;text-align:center}.ring-num{font-size:42px;font-weight:900}.ring-sub{font-size:11px;color:var(--muted)}
    .exercise-done-label{display:block;margin-top:6px;color:#ff8756;font-size:10px;font-weight:900;letter-spacing:.8px}
    @media(min-width:700px){main{padding-left:28px;padding-right:28px}.topbar{padding-left:28px;padding-right:28px}}
  </style>
</head>
<body>
<!-- RUTINA_BUILD_V16 -->
<div class="app">
  <header class="topbar" id="topbar">
    <div><div class="eyebrow">ENTRENAMIENTO</div><h1 id="appName">RUTINA</h1></div>
    <button class="round" id="settingsBtn" aria-label="Ajustes">⚙</button>
  </header>
  <main id="screen"></main>
  <nav class="bottom-nav">
    <button class="nav-btn active" data-nav="home"><span>⌂</span><small>Inicio</small></button>
    <button class="nav-btn" data-nav="routine"><span>☰</span><small>Rutina</small></button>
    <button class="nav-btn" data-nav="stats"><span>◔</span><small>Progreso</small></button>
  </nav>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>
(() => {
  const KEY="RUTINA_V9";
  const qs=(s,r=document)=>r.querySelector(s);
  const qsa=(s,r=document)=>[...r.querySelectorAll(s)];
  const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
  const localISO=(d=new Date())=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
  const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
  const fmtDate=k=>new Date(k+"T12:00:00").toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"});
  const fmtTime=sec=>{sec=Math.max(0,Math.floor(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return [h,m,s].map(x=>String(x).padStart(2,"0")).join(":")};
  const fmtShort=sec=>{sec=Math.max(0,Math.floor(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}h ${m}m ${s}s`:m?`${m}m ${s}s`:`${s}s`};
  const mondayISO=(d=new Date())=>{const x=new Date(d);x.setHours(12,0,0,0);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);return localISO(x)};
  const addDaysISO=(iso,n)=>{const x=new Date(iso+"T12:00:00");x.setDate(x.getDate()+n);return localISO(x)};
  const diffDaysISO=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000);

  let db=loadDB();
  let screen="home", routineId=db.routines[0]?.id||null, dayId=null, exerciseIndex=0;
  let timerHandle=null, restHandle=null, restEnd=0;
  let completionData=null;

  function blankDB(){return {version:10,appTitle:"RUTINA",routines:[]}}
  function loadDB(){
    try{
      const raw=localStorage.getItem(KEY);
      if(raw){
        const d=JSON.parse(raw);
        if(d&&Array.isArray(d.routines)) return normalizeDB(d);
      }
    }catch{}
    // Migrate the most recent older routine database if it exists.
    const oldKeys=["rutina_pwa_v4","rutina_pwa_v3","rutina_pwa_v2","rutina_pwa_v1","rutina_v7","rutina_v6"];
    for(const k of oldKeys){
      try{
        const old=JSON.parse(localStorage.getItem(k)||"");
        if(old?.routines?.length){
          const d=blankDB();
          d.routines=old.routines.map(r=>({
            id:uid(),name:r.name||"Mi rutina",currentWeek:1,weekStartedAt:localISO(),completedWeeks:[],weeks:{},
            days:(r.days||[]).map(x=>({id:uid(),name:x.name||"Día",exercises:(x.exercises||[]).map(e=>({
              id:uid(),name:e.name||"Ejercicio",warmupSets:Number(e.warmupSets||0),workSets:Number(e.sets?.length||e.workSets||3),
              defaultReps:Number(e.defaultReps||8),restSeconds:Number(e.restSeconds??120),unit:e.unit||"kg",sets:Array.from({length:Number(e.sets?.length||e.workSets||3)},()=>({reps:Number(e.defaultReps||8)}))
            }))}))
          }));
          localStorage.setItem(KEY,JSON.stringify(d));
          return d;
        }
      }catch{}
    }
    return blankDB();
  }
  function normalizeDB(d){
    d.routines=d.routines||[];
    d.routines.forEach(r=>{
      r.id=r.id||uid();r.name=r.name||"Mi rutina";r.currentWeek=Number(r.currentWeek||1);r.weekStartedAt=r.weekStartedAt||localISO();r.currentWeekStart=r.currentWeekStart||mondayISO(r.weekStartedAt);r.completedWeeks=r.completedWeeks||[];r.weeks=r.weeks||{};
      r.days=r.days||[];
      r.days.forEach(day=>{
        day.id=day.id||uid();day.name=day.name||"Día";day.exercises=day.exercises||[];
        day.exercises.forEach(e=>{
          e.id=e.id||uid();e.name=e.name||"Ejercicio";e.warmupSets=Number(e.warmupSets||0);e.workSets=Number(e.workSets||e.sets?.length||3);e.defaultReps=Number(e.defaultReps||8);e.restSeconds=Number(e.restSeconds??120);e.unit=e.unit||"kg";e.sets=e.sets||Array.from({length:e.workSets},()=>({reps:e.defaultReps}));
        });
      });
    });
    return d;
  }
  function save(){localStorage.setItem(KEY,JSON.stringify(db))}
  function activeRoutine(){return db.routines.find(r=>r.id===routineId)||db.routines[0]}
  function activeDay(){return activeRoutine()?.days.find(d=>d.id===dayId)}
  function week(r,wn=activeRoutine()?.currentWeek){
    r.weeks[wn]=r.weeks[wn]||{startedAt:wn===r.currentWeek?(r.currentWeekStart||r.weekStartedAt||localISO()):localISO(),closedAt:null,days:{}};
    return r.weeks[wn]
  }
  function ensureCurrentWeek(r){
    if(!r)return false;
    let start=r.currentWeekStart||mondayISO(r.weekStartedAt||localISO());
    const target=mondayISO();
    if(!start)start=target;
    let changed=false;
    while(start<target){
      const wn=r.currentWeek;
      const w=week(r,wn);
      if(!w.closedAt) w.closedAt=addDaysISO(start,6)+"T23:59:59";
      if(!r.completedWeeks.some(x=>Number(x.week)===Number(wn))){
        r.completedWeeks.push({week:wn,closedAt:w.closedAt,trained:trainedCount(r,wn),total:r.days.length,duration:weekDuration(r,wn)});
      }
      r.currentWeek++;
      start=addDaysISO(start,7);
      r.currentWeekStart=start;
      r.weekStartedAt=start;
      week(r,r.currentWeek);
      changed=true;
    }
    if(!r.currentWeekStart){r.currentWeekStart=target;r.weekStartedAt=target;changed=true}
    return changed;
  }
  function dayState(r,d,wn=r.currentWeek){const w=week(r,wn);w.days[d.id]=w.days[d.id]||{status:"pending",startedAt:null,finishedAt:null,durationSec:0,comments:"",exercises:{}};return w.days[d.id]}
  function exState(ds,e){ds.exercises[e.id]=ds.exercises[e.id]||{warmup:[],work:Array.from({length:e.workSets},()=>({weight:"",reps:e.defaultReps,unit:e.unit,done:false})),comments:"",completed:false};return ds.exercises[e.id]}
  function setVal(arr,i,defaults={}){arr[i]=arr[i]||{weight:"",reps:"",unit:"kg",done:false,...defaults};return arr[i]}
  function weekSettled(r,wn=r.currentWeek){return r.days.length>0 && r.days.every(d=>dayState(r,d,wn).status!=="pending")}
  function trainedCount(r,wn=r.currentWeek){return r.days.filter(d=>dayState(r,d,wn).status==="trained").length}
  function completedWorkSets(r,d){const ds=dayState(r,d);return d.exercises.length>0&&d.exercises.every(e=>{const es=exState(ds,e);return es.work.length>=e.workSets&&es.work.slice(0,e.workSets).every(v=>v.done)})}
  function completedAllExercises(r,d){return d.exercises.length>0&&d.exercises.every(e=>exState(dayState(r,d),e).completed)}
  function startSession(){const r=activeRoutine(),d=activeDay();if(!r||!d)return;const ds=dayState(r,d);if(ds.status==="skipped"){toast("Este día está marcado como NO ENTRENÉ.");return}if(!ds.startedAt)ds.startedAt=new Date().toISOString();ds.status="pending";save();screen="workout";exerciseIndex=0;startMainTimer();render()}
  function startMainTimer(){clearInterval(timerHandle);timerHandle=setInterval(updateTimers,500);updateTimers()}
  function clearMainTimer(){clearInterval(timerHandle);timerHandle=null}
  function startRest(sec,name){clearInterval(restHandle);restEnd=Date.now()+sec*1000;const panel=qs("#restPanel"),time=qs("#restTime"),lbl=qs("#restSmall");if(panel)panel.classList.add("show");if(lbl)lbl.textContent=`DESCANSO · ${name}`;restHandle=setInterval(()=>{const left=Math.max(0,Math.ceil((restEnd-Date.now())/1000));if(time)time.textContent=fmtTime(left);if(left<=0){clearInterval(restHandle);restHandle=null;toast("Descanso terminado")}},250)}
  function skipRest(){clearInterval(restHandle);restHandle=null;qs("#restPanel")?.classList.remove("show")}
  function updateTimers(){if(screen!=="workout")return;const r=activeRoutine(),d=activeDay();if(!r||!d)return;const ds=dayState(r,d);if(!ds.startedAt)return;const sec=Math.max(0,Math.floor((Date.now()-new Date(ds.startedAt).getTime())/1000));const el=qs("#elapsed");if(el)el.textContent=fmtTime(sec)}
  function weekDuration(r,wn){return r.days.reduce((a,d)=>a+(dayState(r,d,wn).durationSec||0),0)}
  function finishExercise(){
    const r=activeRoutine(),d=activeDay(),e=d.exercises[exerciseIndex],ds=dayState(r,d),es=exState(ds,e);
    if(!(es.work.slice(0,e.workSets).length===e.workSets && es.work.slice(0,e.workSets).every(v=>v.done))){
      toast("Completa los sets de trabajo antes de continuar.");
      return;
    }
    es.completed=true;
    save();
    if(exerciseIndex<d.exercises.length-1){
      exerciseIndex++;
      render();
    }else{
      finishSession(true);
    }
  }
  function finishSession(allDone=false){
    const r=activeRoutine(),d=activeDay(),ds=dayState(r,d);
    if(!allDone&&!completedAllExercises(r,d)){
      if(!confirm("Todavía hay ejercicios sin terminar. ¿Quieres finalizar el entrenamiento de todas formas?"))return;
    }
    ds.status="trained";ds.finishedAt=new Date().toISOString();
    ds.durationSec=ds.startedAt?Math.max(0,Math.floor((new Date(ds.finishedAt)-new Date(ds.startedAt))/1000)):0;
    ds.comments=qs("#sessionComments")?.value??ds.comments??"";
    d.exercises.forEach(e=>{const es=exState(ds,e);if(es.completed===false&&allDone)es.completed=true});
    save();clearMainTimer();skipRest();
    screen="home";render();toast("Entrenamiento guardado")
  }
  function noTrain(){

    if(ds.status==="skipped"){toast("Este día ya está marcado como NO ENTRENÉ.");return}

    if(!ok)return;
    ds.status="skipped";ds.finishedAt=new Date().toISOString();ds.durationSec=0;save();
    screen="home";render();toast("Día registrado como NO ENTRENÉ")
  }

        ${prev?`<div class="card" style="margin:12px 0 0;padding:12px;background:#1a0c07"><div class="small"><b>Semana anterior:</b> ${prev.map(v=>`${v.weight||0} ${v.unit||unit} × ${v.reps||0}`).join(" · ")}</div></div>`:""}
        <div style="margin-top:12px"><label class="label">NOTAS DEL EJERCICIO</label><textarea class="textarea" id="exerciseComment" placeholder="Comentarios sobre este ejercicio...">${esc(es.comments||"")}</textarea></div>

      ${prevHtml}
      <div class="row" style="margin-top:12px;flex-wrap:wrap">${ds.status==="pending"?`<button class="btn primary" data-action="continue-exercise">CONTINUAR ENTRENAMIENTO</button>`:""}<button class="btn secondary" data-action="exercise-edit-from-detail">EDITAR</button></div>`;
  }

  function stats(){
    const r=activeRoutine();if(!r)return `<div class="empty">Crea una rutina primero.</div>`;
    const entries=[];
    Object.entries(r.weeks||{}).forEach(([wn,w])=>Object.entries(w.days||{}).forEach(([did,ds])=>{if(ds.status==="trained")entries.push({wn:Number(wn),did,ds})}));
    entries.sort((a,b)=>(b.ds.finishedAt||"").localeCompare(a.ds.finishedAt||""));
    const now=new Date(),year=now.getFullYear(),month=now.getMonth(),first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),start=first.getDay()||7;
    const trainedDates=entries.map(x=>(x.ds.finishedAt||"").slice(0,10));
    let cal="";for(let i=1;i<start;i++)cal+="<div></div>";for(let d=1;d<=days;d++){const k=localISO(new Date(year,month,d));cal+=`<div class="cal-day ${trainedDates.includes(k)?"trained ":""}${k===localISO()?"today":""}">${d}</div>`}
    return `<div class="between"><div><div class="eyebrow">PROGRESO</div><h2>${esc(r.name)}</h2></div><button class="round" data-action="new-routine">+</button></div>
      <div class="grid3"><div class="stat"><b>${streak(r)}</b><span>racha</span></div><div class="stat"><b>${entries.length}</b><span>entrenamientos</span></div><div class="stat"><b>${r.currentWeek-1}</b><span>semanas</span></div></div>
      <div class="card"><div class="between"><h3 style="text-transform:capitalize">${now.toLocaleDateString("es-MX",{month:"long",year:"numeric"})}</h3><span class="small">${entries.length} sesiones</span></div><div class="calendar">${["L","M","X","J","V","S","D"].map(x=>`<div class="cal-head">${x}</div>`).join("")}${cal}</div></div>
      <div class="section-title">Historial</div>${entries.slice(0,20).map(x=>{const d=r.days.find(y=>y.id===x.did);return `<div class="card"><b>${esc(d?.name||"Día")}</b><div class="small" style="margin-top:4px">Semana ${x.wn} · ${fmtDate((x.ds.finishedAt||"").slice(0,10))} · ${fmtTime(x.ds.durationSec)}</div>${x.ds.comments?`<div class="small" style="margin-top:4px">“${esc(x.ds.comments)}”</div>`:""}</div>`}).join("")||`<div class="empty">Todavía no hay sesiones completadas.</div>`}`;

  function streak(r){
    const days=Object.values(r.weeks||{}).flatMap(w=>Object.values(w.days||{})).filter(x=>x.status==="trained").map(x=>(x.finishedAt||"").slice(0,10)).filter(Boolean);
    const uniq=[...new Set(days)].sort().reverse();if(!uniq.length)return 0;let n=0,d=new Date(localISO());if(!uniq.includes(localISO()))d.setDate(d.getDate()-1);while(uniq.includes(localISO(d))){n++;d.setDate(d.getDate()-1)}return n;
  }
  function previousExercise(r,d,e){
    if(r.currentWeek<=1)return null;const ds=dayState(r,d,r.currentWeek-1),es=ds.exercises?.[e.id];if(!es||ds.status!=="trained")return null;return es.work?.filter(Boolean)||null;
  }

  function bind(){
    qsa(".nav-btn").forEach(b=>b.onclick=()=>{screen=b.dataset.nav;render()});
    qs("#settingsBtn").onclick=()=>settings();
    qsa("[data-open-day]").forEach(el=>el.onclick=()=>{dayId=el.dataset.openDay;screen="day";render()});
    qsa("[data-action]").forEach(el=>el.onclick=(ev)=>{ev.stopPropagation();action(el.dataset.action,el)});
    qsa("[data-field]").forEach(i=>i.oninput=()=>updateCurrentValue(i));
    qs("#sessionComments")?.addEventListener("input",()=>{const r=activeRoutine(),d=activeDay();dayState(r,d).comments=qs("#sessionComments").value;save()});
    qs("#exerciseComment")?.addEventListener("input",()=>{const r=activeRoutine(),d=activeDay(),e=d.exercises[exerciseIndex];exState(dayState(r,d),e).comments=qs("#exerciseComment").value;save()});
  }

  function updateCurrentValue(inp){
    const r=activeRoutine(),d=activeDay(),e=d.exercises[exerciseIndex],es=exState(dayState(r,d),e);
    const arr=inp.dataset.type==="warmup"?es.warmup:es.work;const v=setVal(arr,Number(inp.dataset.idx),{unit:e.unit,reps:e.defaultReps,done:false});
    v[inp.dataset.field]=inp.value;save();
  }

  function action(a,el){
    if(a==="new-routine")return createRoutine();
    if(a==="edit-routine")return editRoutine();
    if(a==="delete-routine")return deleteRoutine();
    if(a==="switch-routine")return switchRoutine(el.dataset.rid);
    if(a==="go-routine"){screen="routine";return render()}
    if(a==="add-day")return addDay();
    if(a==="edit-day")return editDay();
    if(a==="add-exercise")return addExercise();
    if(a==="open-exercise"){const e=activeDay().exercises.find(x=>x.id===el.dataset.eid);exerciseIndex=activeDay().exercises.indexOf(e);screen="exercise-detail";return render()}
    if(a==="exercise-edit-from-detail")return editExercise(activeDay().exercises[exerciseIndex].id);
    if(a==="continue-exercise")return startSession();
    if(a==="exercise-edit")return editExercise(el.dataset.eid);
    if(a==="exercise-delete")return deleteExercise(el.dataset.eid);
    if(a==="delete-exercise")return deleteExercise(el.dataset.eid);
    if(a==="start-day"){dayId=el.dataset.did;return startSession()}
    if(a==="skip-day"){dayId=el.dataset.did;return noTrain()}
    if(a==="start-workout")return startSession();
    if(a==="back-home"){screen="home";return render()}
    if(a==="back-plan"){screen="day";return render()}
    if(a==="toggle-set")return toggleSet(el.dataset.type,Number(el.dataset.idx));
    if(a==="add-set")return addSet();
    if(a==="add-warmup")return addWarmup();
    if(a==="unit")return changeUnit(el.dataset.unit);
    if(a==="skip-rest")return skipRest();
    if(a==="finish-exercise")return finishExercise();
    if(a==="finish-now")return finishSession(false);
    if(a==="no-train")return noTrain();
  }

  function toggleSet(type,idx){
    const r=activeRoutine(),d=activeDay(),e=d.exercises[exerciseIndex],es=exState(dayState(r,d),e),arr=type==="warmup"?es.warmup:es.work,v=setVal(arr,idx,{unit:e.unit,reps:e.defaultReps,done:false});
    v.done=!v.done;save();render();if(v.done)startRest(e.restSeconds,e.name);
    if(type==="work"&&es.work.slice(0,e.workSets).every(x=>x.done))toast("Sets de trabajo completos");
  }
  function addSet(){const r=activeRoutine(),d=activeDay(),e=d.exercises[exerciseIndex];e.workSets++;e.sets=e.sets||[];e.sets.push({reps:e.defaultReps});const es=exState(dayState(r,d),e);es.work.push({weight:"",reps:e.defaultReps,unit:e.unit,done:false});save();render()}
  function addWarmup(){const r=activeRoutine(),d=activeDay(),e=d.exercises[exerciseIndex];e.warmupSets++;const es=exState(dayState(r,d),e);es.warmup.push({weight:"",reps:e.defaultReps,unit:e.unit,done:false});save();render()}
  function changeUnit(unit){
    const r=activeRoutine(),d=activeDay(),e=d.exercises[exerciseIndex],es=exState(dayState(r,d),e),old=e.unit;if(old===unit)return;
    const conv=arr=>arr.forEach(v=>{if(v.weight!==""&&Number.isFinite(Number(v.weight)))v.weight=(unit==="lb"?Number(v.weight)*2.2046226:Number(v.weight)/2.2046226).toFixed(1);v.unit=unit});
    conv(es.warmup);conv(es.work);e.unit=unit;save();render();
  }

  function openModal(title,body,onSave,saveText="Guardar"){
    qs("#modalRoot").innerHTML=`<div class="modal-bg" data-modal-bg><div class="modal"><div class="modal-top"><h3>${title}</h3><button class="close" data-close>×</button></div>${body}<div class="modal-actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="modalSave">${saveText}</button></div></div></div>`;
    qsa("[data-close]").forEach(x=>x.onclick=closeModal);
    qs("[data-modal-bg]").onclick=e=>{if(e.target.dataset.modalBg!==undefined)closeModal()};
    qs("#modalSave").onclick=()=>{onSave();closeModal();render()};
  }
  function closeModal(){qs("#modalRoot").innerHTML=""}
  function createRoutine(){openModal("Nueva rutina",`<div class="form"><div><label class="label">NOMBRE</label><input id="mName" class="input" placeholder="Ej. PPL X LEG"></div><div class="small">No hay una duración fija: la rutina puede continuar indefinidamente.</div></div>`,()=>{const r={id:uid(),name:qs("#mName").value.trim()||"Mi rutina",currentWeek:1,weekStartedAt:mondayISO(),currentWeekStart:mondayISO(),completedWeeks:[],weeks:{},days:[]};db.routines.push(r);routineId=r.id;dayId=null;save()})}
  function editRoutine(){const r=activeRoutine();openModal("Editar nombre de rutina",`<div><label class="label">NOMBRE</label><input id="mName" class="input" value="${esc(r.name)}"></div>`,()=>{r.name=qs("#mName").value.trim()||r.name;save()})}
  function deleteRoutine(){const r=activeRoutine();if(!r)return;if(!confirm(`¿Borrar "${r.name}" y todo su historial?`))return;db.routines=db.routines.filter(x=>x.id!==r.id);routineId=db.routines[0]?.id||null;dayId=null;save();screen="home";render()}
  function switchRoutine(id){routineId=id;dayId=null;screen="home";save();render()}
  function addDay(){const r=activeRoutine();openModal("Agregar día",`<div><label class="label">NOMBRE DEL DÍA</label><input id="mName" class="input" placeholder="Ej. Lunes - Pecho"></div>`,()=>{r.days.push({id:uid(),name:qs("#mName").value.trim()||`Día ${r.days.length+1}`,exercises:[]});save()})}
  function editDay(){const r=activeRoutine(),d=activeDay();openModal("Editar día",`<div><label class="label">NOMBRE</label><input id="mName" class="input" value="${esc(d.name)}"></div>`,()=>{d.name=qs("#mName").value.trim()||d.name;save()})}
  function addExercise(editId=null){const r=activeRoutine(),d=activeDay(),e=editId?d.exercises.find(x=>x.id===editId):null;openModal(e?"Editar ejercicio":"Agregar ejercicio",`
    <div class="form">
      <div><label class="label">EJERCICIO</label><input id="mName" class="input" placeholder="Ej. Press banca" value="${esc(e?.name||"")}"></div>
      <div class="two"><div><label class="label">APROXIMACIONES</label><input id="mWarm" class="input" type="number" min="0" value="${e?.warmupSets??1}"></div><div><label class="label">SETS DE TRABAJO</label><input id="mSets" class="input" type="number" min="1" value="${e?.workSets||3}"></div></div>
      <div class="two"><div><label class="label">REPS OBJETIVO</label><input id="mReps" class="input" type="number" min="0" value="${e?.defaultReps||8}"></div><div><label class="label">DESCANSO (MIN)</label><input id="mRest" class="input" type="number" min="0" step=".25" value="${e?((e.restSeconds||120)/60):2}"></div></div>
      <div><label class="label">UNIDAD</label><select id="mUnit" class="select"><option value="kg" ${(e?.unit||"kg")==="kg"?"selected":""}>Kilogramos (kg)</option><option value="lb" ${(e?.unit||"kg")==="lb"?"selected":""}>Libras (lb)</option></select></div>
    </div>`,
    ()=>{const name=qs("#mName").value.trim()||"Ejercicio",warm=Math.max(0,parseInt(qs("#mWarm").value||0)),sets=Math.max(1,parseInt(qs("#mSets").value||1)),reps=Math.max(0,parseInt(qs("#mReps").value||0)),rest=Math.max(0,Math.round(Number(qs("#mRest").value||0)*60)),unit=qs("#mUnit").value;
      if(e){e.name=name;e.warmupSets=warm;e.workSets=sets;e.defaultReps=reps;e.restSeconds=rest;e.unit=unit}else d.exercises.push({id:uid(),name,warmupSets:warm,workSets:sets,defaultReps:reps,restSeconds:rest,unit,sets:Array.from({length:sets},()=>({reps}))});save()})}
  function editExercise(id){
    const e=activeDay().exercises.find(x=>x.id===id);
    openModal("Editar ejercicio",`
      <div class="form">
        <div><label class="label">NOMBRE</label><input id="mName" class="input" value="${esc(e.name)}"></div>
        <div class="two">
          <div><label class="label">APROXIMACIONES</label><input id="mWarm" class="input" type="number" min="0" step="1" value="${e.warmupSets||0}"></div>
          <div><label class="label">SETS DE TRABAJO</label><input id="mSets" class="input" type="number" min="1" step="1" value="${e.workSets||1}"></div>
        </div>
        <div class="two">
          <div><label class="label">REPS OBJETIVO</label><input id="mReps" class="input" type="number" min="0" step="1" value="${e.defaultReps||0}"></div>
          <div><label class="label">DESCANSO (MINUTOS)</label><input id="mRest" class="input" type="number" min="0" step="0.25" value="${((e.restSeconds||0)/60).toFixed(2).replace(/\.00$/,'')}"></div>
        </div>
        <div>
          <label class="label">UNIDAD</label>
          <select id="mUnit" class="select">
            <option value="kg" ${(e.unit||"kg")==="kg"?"selected":""}>Kilogramos (kg)</option>
            <option value="lb" ${(e.unit||"kg")==="lb"?"selected":""}>Libras (lb)</option>
          </select>
        </div>
        <div class="small">Puedes corregir estos datos después de crear el ejercicio. El nuevo descanso se aplicará al siguiente set que completes.</div>
        <button class="btn danger wide" type="button" id="deleteExerciseNow">Borrar este ejercicio</button>
      </div>`,
      ()=>{
        const r=activeRoutine(),d=activeDay(),es=exState(dayState(r,d),e);
        e.name=qs("#mName").value.trim()||e.name;
        e.warmupSets=Math.max(0,parseInt(qs("#mWarm").value||0,10));
        e.workSets=Math.max(1,parseInt(qs("#mSets").value||1,10));
        e.defaultReps=Math.max(0,parseInt(qs("#mReps").value||0,10));
        e.restSeconds=Math.max(0,Math.round(Number(qs("#mRest").value||0)*60));

        const newUnit=qs("#mUnit").value;
        if(newUnit!==e.unit){
          const conv=arr=>arr.forEach(v=>{
            if(v.weight!=="" && Number.isFinite(Number(v.weight))){
              v.weight=(newUnit==="lb"?Number(v.weight)*2.2046226:Number(v.weight)/2.2046226).toFixed(1);
            }
            v.unit=newUnit;
          });
          conv(es.warmup);conv(es.work);
          e.unit=newUnit;
        }

        while(es.work.length<e.workSets){
          es.work.push({weight:"",reps:e.defaultReps,unit:e.unit,done:false});
        }
        if(es.work.length>e.workSets) es.work=es.work.slice(0,e.workSets);

        e.sets=Array.from({length:e.workSets},(_,i)=>e.sets?.[i]||{reps:e.defaultReps});
        save();
      }
    );

    qs("#deleteExerciseNow").onclick=()=>{
      if(!confirm(`¿Borrar "${e.name}" de la rutina?`)) return;
      const d=activeDay();
      d.exercises=d.exercises.filter(x=>x.id!==id);
      closeModal();
      save();
      render();
      toast("Ejercicio borrado");
    };
  }

  function deleteExercise(id){
    const d=activeDay(),e=d?.exercises.find(x=>x.id===id);
    if(!d||!e)return;
    if(!confirm(`¿Borrar "${e.name}" de la rutina?`))return;
    d.exercises=d.exercises.filter(x=>x.id!==id);
    if(screen==="workout" && exerciseIndex>=d.exercises.length) exerciseIndex=Math.max(0,d.exercises.length-1);
    save();render();toast("Ejercicio borrado");
  }
  function settings(){
    openModal("Cambiar nombre del entrenamiento",`
      <div class="form">
        <div>
          <label class="label">NOMBRE</label>
          <input id="mAppName" class="input" value="${esc(db.appTitle||"RUTINA")}" placeholder="Ej. RUTINA">
        </div>
        <div class="small">Este nombre aparece arriba de la aplicación. No cambia el nombre de ninguna rutina.</div>
      </div>`,
      ()=>{
        db.appTitle=qs("#mAppName").value.trim()||"RUTINA";
        save();
      }
    );
  }

  // Boot
  const bootRoutine=activeRoutine();
  if(bootRoutine && ensureCurrentWeek(bootRoutine)) save();
  render();
  if("serviceWorker" in navigator){
    window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  }
})();
</script>
